name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Types and dist match source
        run: npm run check
      - name: Tests
        run: |
          for file in test/*.test.mjs; do
            node --test "$file" || exit "$?"
          done
      - name: No private words
        run: npm run scan
        env:
          HAECHI_SCAN_PATTERNS: ${{ secrets.HAECHI_SCAN_PATTERNS }}
